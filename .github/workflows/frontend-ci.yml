name: Frontend CI

# 解析ポータル（frontend/portal）の CI。
# frontend/ohif は OHIF Viewer の upstream をベンダリングしたもので、
# yarn + lerna + git submodule 構成のため本リポジトリの CI では扱わない
# （デプロイは scripts/deploy/deploy_ohif.sh で別途実施）。
on:
  push:
    paths:
      - "frontend/portal/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/portal/**"

jobs:
  portal-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/portal/package-lock.json

      - name: Install dependencies
        # npm ci はクロスプラットフォームの optional 依存（rollup/oxc native）で
        # lock 不整合になりやすいため install を使う
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
