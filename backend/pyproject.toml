[tool.ruff]
target-version = "py311"
line-length = 100
src = ["lambda", "shared", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lambda --cov=shared --cov-report=term-missing"

[tool.coverage.run]
source = ["lambda", "shared"]
omit = ["tests/*"]
